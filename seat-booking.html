<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserve Seat | The Royal Oasis</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0b0f0d; color: #e5e7eb; }
        .luxury-font { font-family: 'Cinzel', serif; }
        .glass-card { background: rgba(18, 26, 20, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(212, 175, 55, 0.2); }
        .seat-booked {
            background-color: #052e16 !important;
            border-color: #22c55e !important;
            color: #4ade80 !important;
            box-shadow: 0 0 10px rgba(34, 197, 94, 0.6);
        }
    </style>
</head>
<body class="p-4 pb-20">

    <div class="flex items-center justify-between pb-4 border-b border-gray-800 mb-4">
        <a href="index.html" class="text-xs text-gray-400 hover:text-white">← Back to Home</a>
        <h1 class="luxury-font text-sm font-bold text-[#d4af37]">LIVE SEAT MAP</h1>
    </div>

    <!-- Seat Status Legend -->
    <div class="glass-card p-3 rounded-xl flex justify-around text-xs mb-4">
        <div class="flex items-center gap-2">
            <span class="w-4 h-4 rounded bg-[#131b15] border border-gray-600 block"></span>
            <span class="text-gray-300">Available (Click to Book)</span>
        </div>
        <div class="flex items-center gap-2">
            <span class="w-4 h-4 rounded bg-[#052e16] border border-[#22c55e] shadow-[0_0_8px_#22c55e] block"></span>
            <span class="text-[#4ade80] font-semibold">Booked</span>
        </div>
    </div>

    <!-- 100 Seats Grid -->
    <div id="seatGrid" class="grid grid-cols-5 gap-2 max-w-md mx-auto"></div>

    <!-- Interactive Booking Popup Modal -->
    <div id="bookingModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-4">
        <div class="glass-card rounded-2xl w-full max-w-sm p-5 border border-amber-500/40 relative animate-fade-in">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-400 text-lg">&times;</button>
            
            <h3 class="luxury-font text-base font-bold text-white">Reserve Seat <span id="modalSeatNumber" class="text-[#d4af37]">#--</span></h3>
            
            <!-- Price Comparison inside Modal -->
            <div class="my-3 p-2.5 rounded-lg bg-emerald-950/40 border border-emerald-500/30 text-xs">
                <p class="text-emerald-400 font-semibold">🎉 Online Advance Offer: ₹500/month</p>
                <p class="text-gray-400 text-[11px] mt-0.5">(Direct counter admission: ₹600/month)</p>
            </div>

            <!-- Student Form -->
            <form id="studentForm" class="space-y-3 mt-4 text-xs">
                <div>
                    <label class="block text-gray-300 mb-1">Your Full Name / पूरा नाम</label>
                    <input type="text" id="custName" required placeholder="e.g. Rahul Sharma" class="w-full p-2.5 rounded-lg bg-[#0b0f0d] border border-gray-700 text-white focus:outline-none focus:border-amber-400">
                </div>
                <div>
                    <label class="block text-gray-300 mb-1">Mobile Number / मोबाइल नंबर</label>
                    <input type="tel" id="custPhone" required placeholder="e.g. 9876543210" class="w-full p-2.5 rounded-lg bg-[#0b0f0d] border border-gray-700 text-white focus:outline-none focus:border-amber-400">
                </div>
                <div>
                    <label class="block text-gray-300 mb-1">Target Exam / क्या पढ़ाई कर रहे हैं?</label>
                    <input type="text" id="custExam" required placeholder="e.g. NEET, JEE, UPSC, Graduation" class="w-full p-2.5 rounded-lg bg-[#0b0f0d] border border-gray-700 text-white focus:outline-none focus:border-amber-400">
                </div>
                
                <button type="submit" class="w-full mt-2 py-3 bg-green-600 hover:bg-green-700 text-white font-bold rounded-xl text-xs flex items-center justify-center gap-1.5 shadow-lg shadow-green-900/40">
                    <span>📲 Send WhatsApp Request for ₹500 QR Code</span>
                </button>
            </form>
        </div>
    </div>

    <script>
        const OWNER_PHONE = "919251221747";
        const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSE9tXNf7RMS2_PThr-HW_BzGy5vuQErPmFrxb-r8DFp28VBt43irse3dv9E4PBZq15-5V4uMkgr7il/pub?gid=0&single=true&output=csv";

        let bookedSeats = [];
        let currentSelectedSeat = null;
        const grid = document.getElementById('seatGrid');

        async function fetchSeatData() {
            try {
                // गूगल कैश रोकने के लिए टाइमस्टैम्प
                const response = await fetch(CSV_URL + '&t=' + new Date().getTime());
                const csvData = await response.text();
                const lines = csvData.trim().split(/\r?\n/);

                bookedSeats = [];
                for (let i = 1; i < lines.length; i++) {
                    const row = lines[i].split(',');
                    if (row.length >= 2) {
                        const seatNum = parseInt(row[0].trim());
                        const status = row[1].trim().toLowerCase();
                        
                        // केवल साफ़ 'booked' मिलने पर ही हरी लाइट जलेगी
                        if (status === 'booked') {
                            bookedSeats.push(seatNum);
                        }
                    }
                }
                buildSeatGrid();
            } catch (err) {
                console.error("Sheet loading failed:", err);
                bookedSeats = [4, 8, 15];
                buildSeatGrid();
            }
        }

        function buildSeatGrid() {
            grid.innerHTML = '';
            for (let i = 1; i <= 100; i++) {
                const seat = document.createElement('div');
                seat.className = 'h-11 rounded-lg flex items-center justify-center text-xs font-semibold border cursor-pointer transition';
                seat.innerText = i;

                if (bookedSeats.includes(i)) {
                    seat.classList.add('seat-booked');
                } else {
                    seat.classList.add('bg-[#131b15]', 'border-[#263529]', 'text-gray-300');
                    seat.onclick = () => openBookingModal(i);
                }
                grid.appendChild(seat);
            }
        }

        function openBookingModal(seatNum) {
            currentSelectedSeat = seatNum;
            document.getElementById('modalSeatNumber').innerText = '#' + seatNum;
            document.getElementById('bookingModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('bookingModal').classList.add('hidden');
        }

        document.getElementById('studentForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('custName').value;
            const phone = document.getElementById('custPhone').value;
            const exam = document.getElementById('custExam').value;

            const text = `*New Seat Reservation Request*%0A%0A` +
                         `*Selected Seat:* %23${currentSelectedSeat}%0A` +
                         `*Student Name:* ${name}%0A` +
                         `*Mobile:* ${phone}%0A` +
                         `*Course/Exam:* ${exam}%0A%0A` +
                         `*Requested Plan:* Online Advance Discount (₹500/month)%0A` +
                         `Sir, please send your QR Code so I can complete the payment and lock my seat.`;

            window.open(`https://wa.me/${OWNER_PHONE}?text=${text}`, '_blank');
        });

        fetchSeatData();
    </script>
</body>
</html>
