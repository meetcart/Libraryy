<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Seat Controller</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-200 p-5">
    <div class="max-w-md mx-auto">
        <h1 class="text-xl font-bold text-amber-400">Library Owner Panel</h1>
        <p class="text-xs text-gray-400 mt-1">टैप करके सीट को खाली या बुक (Green) मार्क करें</p>
        
        <div class="bg-gray-900 border border-gray-800 p-4 rounded-xl mt-4">
            <h2 class="text-xs font-semibold text-gray-300 mb-2">Instructions for Owner:</h2>
            <ul class="text-xs text-gray-400 list-disc pl-4 space-y-1">
                <li>जब कोई छात्र ₹500 का पेमेंट कर दे, उस सीट नंबर पर टैप करके हरा कर दें।</li>
                <li>ग्रीन सीट का मतलब है कि सीट बुक हो चुकी है।</li>
            </ul>
        </div>

        <div id="adminSeats" class="grid grid-cols-5 gap-2 mt-6"></div>
    </div>

    <script>
        const container = document.getElementById('adminSeats');
        let booked = [4, 8, 15, 23, 31, 42, 56, 73, 89];

        for(let i=1; i<=100; i++) {
            const btn = document.createElement('button');
            btn.className = 'h-10 rounded border text-xs font-bold transition';
            btn.innerText = i;
            
            if(booked.includes(i)) {
                btn.className += ' bg-green-700 border-green-500 text-white';
            } else {
                btn.className += ' bg-gray-800 border-gray-700 text-gray-300';
            }

            btn.onclick = function() {
                this.classList.toggle('bg-green-700');
                this.classList.toggle('border-green-500');
                this.classList.toggle('text-white');
                this.classList.toggle('bg-gray-800');
                this.classList.toggle('border-gray-700');
            }
            container.appendChild(btn);
        }
    </script>
</body>
</html>
